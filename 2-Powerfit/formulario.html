<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción - PowerFit</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <!-- Contenedor que dividirá la pantalla en dos -->
    <div class="layout-pantalla-dividida">
        
        <!-- Panel Izquierdo: Fijo y con el Logo -->
        <aside class="panel-fijo-logo">
            <img src="styles/logo-gimnasio.png" alt="Logo PowerFit">
            <h1>PowerFit</h1>
        </aside>

        <!-- Panel Derecho: Con el formulario que hace scroll -->
        <main class="contenedor-formulario-scroll">
            <section class="caja-formulario">
                <h2>Formulario de Inscripción</h2>
                <p>Completa tus datos y da el primer paso hacia tu transformación.</p>

                <form id="formInscripcion">
                    <!-- Bloque 1: Datos Personales -->
                    <fieldset>
                        <legend>Datos Personales</legend>
                        <div class="grupo-input">
                            <label for="nombre">Nombre Completo:</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                        </div>
                        <div class="grupo-input">
                            <label for="email">Correo Electrónico:</label>
                            <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                        </div>
                        <div class="grupo-input">
                            <label for="telefono">Teléfono:</label>
                            <input type="tel" id="telefono" name="telefono" placeholder="+54 9 11..." required>
                        </div>
                    </fieldset>

                    <!-- Bloque 2: Detalles del Plan -->
                    <fieldset>
                        <legend>Detalles del Entrenamiento</legend>
                        <div class="grupo-input">
                            <label for="clase">Disciplina:</label>
                            <select id="clase" name="clase" required>
                                <option value="" disabled selected>Selecciona una clase</option>
                                <option value="musculacion">Musculación</option>
                                <option value="crossfit">Crossfit</option>
                                <option value="yoga">Yoga</option>
                            </select>
                        </div>

                        <div class="grupo-input">
                            <label for="dias">Plan Semanal:</label>
                            <select id="dias" name="dias" required>
                                <option value="" disabled selected>Selecciona tus días</option>
                                <option value="2d">2 Días por semana</option>
                                <option value="3d">3 Días por semana</option>
                                <option value="5d">5 Días por semana</option>
                            </select>
                        </div>

                        <div class="grupo-input">
                            <label for="turno">Turno de preferencia:</label>
                            <select id="turno" name="turno" required>
                                <option value="" disabled selected>Selecciona un turno</option>
                                <option value="Mañana">Mañana</option>
                                <option value="Tarde">Tarde</option>
                            </select>
                        </div>
                    </fieldset>

                    <button type="submit" class="btn-primario btn-formulario">Confirmar Inscripción</button>
                </form>
            </section>
        </main>
    </div>

    <script src="script-formulario.js"></script>
</body>
</html>
