<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos los Destinos - Mundo Viajes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
</head>
<body>
    <header id="Header">
        <img src="{{ url_for('static', filename='styles/header.jfif') }}" alt="imagen header">
    </header>
    
    <nav>
        <a href="index.html#Header" class="logo-nav">
            <img src="{{ url_for('static', filename='styles/logo-viajes.png')}}" alt="Logo Mundo Viajes mini">
            <span> Mundo Viajes </span>
        </a>
        <ul>
            <li><a href="index.html#Inicio"> Inicio </a></li>
            <li><a href="index.html#Destinos"> Disponibles </a></li>
            <li><a href="index.html#Promociones"> Promociones </a></li>
            <li><a href="#Contacto"> Contacto </a></li>
        </ul>
    </nav>

    <main>
        <!-- SECCIÓN 1: Galería Animada -->
        <section class="seccion-galeria">
            <h1 style="text-align: center; color: #044974; font-size: 3rem;">Explorá Nuestro Catálogo</h1>
            <div class="carrusel-infinito">
                <div class="track-carrusel">
                    <!-- Duplicamos las imágenes para crear la ilusión de scroll infinito -->
                    <img src="{{ url_for('static', filename='styles/playa.jfif')}}" alt="Playa">
                    <img src="{{ url_for('static', filename='styles/montana.jfif')}}" alt="Montaña">
                    <img src="{{ url_for('static', filename='styles/ciudad.jfif')}}" alt="Ciudad">
                    <img src="{{ url_for('static', filename='styles/familia1.jpg')}}" alt="Familia">
                    <!-- Duplicado -->
                    <img src="{{ url_for('static', filename='styles/playa.jfif')}}" alt="Playa">
                    <img src="{{ url_for('static', filename='styles/montana.jfif')}}" alt="Montaña">
                    <img src="{{ url_for('static', filename='styles/ciudad.jfif')}}" alt="Ciudad">
                    <img src="{{ url_for('static', filename='styles/familia1.jpg')}}" alt="Familia">
                </div>
            </div>
        </section>

        <!-- SECCIÓN 2: Catálogo y Filtros -->
        <section class="seccion-destinos">
            <h2>Filtrar por Temporada Ideal</h2>
            
            <div class="filtros-temporada">
                <button class="btn-filtro activo" data-temporada="todos">Ver Todos</button>
                <button class="btn-filtro" data-temporada="verano">Verano</button>
                <button class="btn-filtro" data-temporada="otono">Otoño</button>
                <button class="btn-filtro" data-temporada="invierno">Invierno</button>
                <button class="btn-filtro" data-temporada="primavera">Primavera</button>
            </div>
            
            <div class="grid-tarjetas" id="contenedor-todos-destinos">
                <!-- Se inyectarán por JS -->
            </div>
        </section>
    </main>

    <footer id="Contacto">
        <div class="footer-info">
            <p><strong>Instagram:</strong> MundoViajes.ig | <strong>X (Twitter):</strong> MundoVajes.blog</p>
            <p><strong>Email de consultas:</strong> <a href="mailto:mundoviajesOG@gmail.com">mundoviajesOG@gmail.com</a></p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/script-todos-destinos.js')}}"></script>
</body>
</html>
