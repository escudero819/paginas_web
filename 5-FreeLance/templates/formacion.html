<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formación | Matías Gil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/inicio.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/formacion.css') }}">

<body>
    <nav>
        <div class="logo">MNG.</div>
        <ul>
            <li><a href="index.html">Volver al Portafolio</a></li>

    <main>

            <div class="contenedor">
                <h2 class="titulo-seccion">Títulos y Certificaciones</h2>
                <ul id="lista-titulos" class="lista-titulos-estetica">
                    <!-- JS inyectará los items de la lista aquí -->
                </ul>
            </div>
        </section>
    </main>

    <footer id="contacto">
        <div class="contenedor">
            <p class="copyright">© 2026 Matías Nehuen Gil Barbosa. Todos los derechos reservados.</p>
