<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
    <title>Checkout - TechnoStore</title>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html#Inicio">Inicio</a></li>
            <li><a href="catalogo.html?cat=moviles">Volver al Catálogo</a></li>
        </ul>
    </nav>
    <main>
        <section id="checkout" style="max-width: 600px; margin: 40px auto; background: var(--color-secundario); padding: 30px; border-radius: 12px;">
            <h2 style="text-align: center;">Finalizar Compra</h2>
            
            <!-- Contenedor del recibo en texto plano -->
            <pre id="recibo-texto" style="background: var(--color-primario); color: var(--color-texto); padding: 20px; border: 1px dashed var(--color-acento); font-family: monospace; white-space: pre-wrap; margin-bottom: 20px;"></pre>
            
            <!-- Formulario de datos del cliente -->
            <form id="form-checkout" class="formulario-contacto">
                <input type="text" name="nombre" id="checkout-nombre" placeholder="Nombre completo" required>
                <input type="email" name="email" id="checkout-email" placeholder="Correo electrónico" required>
                <input type="tel" name="telefono" id="checkout-telefono" placeholder="Teléfono" required>
                <button type="submit" class="btn-primario" style="width: 100%; margin-top: 15px;">Confirmar y Descargar Recibo</button>
            </form>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/script-checkout.js') }}"></script>
</body>
</html>
